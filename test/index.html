function LQ(){const m=OWD(),k=Object.keys(m).filter(x=>Math.abs(m[x])>.004);return`<div class="card"><h3>🤝 السيولة (فلوس مستلفة)</h3><small class="h" style="margin:-4px 0 8px">لما الدرج يخلص وتاخد فلوس من حد، سجّلها هنا. مش بتتحسب عملية ولا عمولة.</small>${k.length?k.map(x=>`<div class="row" style="background:var(--bt);margin:6px 0"><div class="m"><b>${x}</b><small class="h">علينا له</small></div><b>${N(m[x])}</b></div>`).join('')+`<div class="row" style="margin:6px 0"><b class="m">إجمالي علينا</b><b>${N(OT())}</b></div>`:'<small class="h">مفيش سيولة مستلفة دلوقتي</small>'}${RO()?'':`<div class="c2" style="margin-top:10px"><button onclick="lq(1)">⬇️ استلمت سيولة</button><button onclick="lq(-1)">⬆️ رجّعت سيولة</button></div>`}${(S.liq||[]).filter(q=>q.dt==vd&&!q.void).map(q=>`<div class="row" style="margin:6px 0;background:${q.a>0?'var(--gt)':'var(--rt)'}"><div class="m"><b>${q.a>0?'استلام':'سداد'} ${f2(Math.abs(q.a))}</b><small class="h">${q.who} · ${tm(q.tm)}${q.note?' · '+q.note:''}</small></div>${RO()?'':`<button class="dng" onclick="vl(${q.id})">إلغاء</button>`}</div>`).join('')}</div>`}
function lq(s){const d=document.createElement('div');d.className='ov';d.id='ov';d.innerHTML=`<div class="sheet"><div class="grab"></div><h2>${s>0?'استلمت سيولة':'رجّعت سيولة'}</h2><small class="h">${s>0?'الدرج هيزيد بالمبلغ ويتسجل عليك دين لصاحب الفلوس':'الدرج هينقص بالمبلغ ويتخصم من الدين'}</small><label>اسم صاحب الفلوس</label><input id="lw" list="lwl"><datalist id="lwl">${Object.keys(OWD()).map(x=>`<option value="${x}">`).join('')}</datalist><label>المبلغ</label><input id="la" type="number" inputmode="decimal"><label>ملاحظة</label><input id="ln"><div class="er" id="le"></div><button class="pri" onclick="sl(${s})">حفظ</button><button class="pri dng" style="margin-top:8px" onclick="ovx()">إلغاء</button></div>`;document.body.appendChild(d);lock(1);d.onclick=e=>{if(e.target==d)ovx()}}
function sl(s){if(RO())return alert('الوردية مفتوحة - وضع المشاهدة فقط');const w=$('#lw').value.trim(),a=+$('#la').value;if(w.length<2)return $('#le').textContent='اكتب اسم صاحب الفلوس';if(!(a>0))return $('#le').textContent='اكتب مبلغ أكبر من صفر';S.liq=S.liq||[];S.liq.push({id:Date.now(),dt:td(),tm:Date.now(),who:w,a:s*a,note:$('#ln').value.trim(),sh:S.cur?S.cur.no:0,ow:S.cur?S.cur.owner:'-',us:sess.u.n});sv();ovx();vd=td();R()}
function vl(id){if(RO())return alert('الوردية مفتوحة - وضع المشاهدة فقط');const q=S.liq.find(x=>x.id==id);if(q&&confirm('إلغاء السيولة دي؟ هتتشال من الدرج والدين.')){q.void=1;sv();R()}}
init();
// no SW in test build
</script></body></html>
