function pg(t,h){const d=document.createElement('div');d.className='pg';d.innerHTML=`<div style="display:flex;align-items:center;gap:10px;padding:16px 16px 0"><button style="width:auto;min-height:44px;padding:8px 18px" onclick="this.parentElement.parentElement.remove()">‹ رجوع</button><h2 style="flex:1;text-align:center;margin:0">${t}</h2><div style="width:80px"></div></div>${h}`;document.body.appendChild(d);return d}

/* ---------- login ---------- */
function loginV(){killSpl();$('#app').innerHTML=`<div class="pg"><div class="hb" style="padding:52px 20px 40px"><div class="br" style="font-size:48px">${brH()}</div><div class="sub">${escQ(BR().tg)}</div></div><div class="card"><label>اسم المستخدم</label><input id="u" autocomplete="username" placeholder="admin"><label>كلمة السر</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password"><div class="er">${err}</div><button class="pri" onclick="login()">دخول</button><small class="h" style="text-align:center;margin-top:10px">نسخة تجريبية — دخول: admin / 1234</small></div></div>`}
async function login(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,us=S.users.find(x=>x.u==u);
if(!us||us.off||us.h!=await H(p)){err='اسم المستخدم أو كلمة السر غلط';return loginV()}
err='';sess={u:us};localStorage.setItem('merp-sess',JSON.stringify({u:us.u,h:us.h}));R();toast('أهلاً بيك يا '+us.n+' 👋')}
function logout(){ask('تأكيد تسجيل الخروج؟','هتحتاج تسجّل دخولك تاني','تسجيل خروج',()=>{sess=null;localStorage.removeItem('merp-sess');R()})}

const dayS=dt=>S.sales.filter(x=>x.dt==dt);
const costOf=v=>v.items.reduce((s,i)=>s+i.c*i.q,0);
const pName=id=>{const p=S.prods.find(x=>x.id==id);return p?p.n:'-'};
const sumBal=a=>a.reduce((s,x)=>s+(+x.bal||0),0);
const stockVal=()=>S.prods.reduce((s,p)=>s+p.cost*p.stock,0);

const TB=[['h','🏠'],['s','🧾'],['p','📦'],['b','🛒'],['c','💵'],['m','⚙️']];

const tbH=`<div id="tb">${TB.map(([k,i])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';R()"><span>${i}</span>${T[k]}</button>`).join('')}</div>`;
if(tab=='c'){const ap=$('#app');ap.innerHTML='';if(!window._cf){window._cf=document.createElement('iframe');window._cf.className='cf';window._cf.src='../';window._cf.title='الكاش'}ap.appendChild(window._cf);ap.insertAdjacentHTML('beforeend',tbH);return}

const V={};

const act=[...S.sales.map(x=>({t:'بيع',d:`فاتورة #${x.no} · ${x.cn}`,a:x.tot,tm:x.tm,c:'t'})),...S.purs.map(x=>({t:'شراء',d:`أمر شراء #${x.no} · ${x.sn}`,a:x.tot,tm:x.tm||0,c:'w'})),...S.maint.map(x=>({t:'صيانة',d:`${x.dev} · ${x.cust}`,a:x.fee,tm:0,c:''}))].sort((a,b)=>b.tm-a.tm).slice(0,6);
return`<div class="demo">🧪 نسخة تجريبية للتصميم — البيانات دي للعرض بس</div>
<div class="g2">
<div class="card k"><small>💰 مبيعات النهاردة</small><b>${f2(st)}</b></div>
<div class="card k"><small>🛒 مشتريات النهاردة</small><b>${f2(pt)}</b></div>

</div>
<h3 style="margin:14px 16px 0">آخر الحركات</h3>
${act.map(a=>`<div class="row ${a.c}"><div class="m"><b>${a.t}</b><small class="h">${a.d}</small></div><b>${f2(a.a)}</b></div>`).join('')||'<div class="card st n">مفيش حركات لسه</div>'}`};

V.s=function(){const t=td(),s0=S.sales.slice().sort((a,b)=>b.no-a.no);
return`<div class="bdg">فواتير النهاردة: ${dayS(t).length} · إجمالي: ${f2(dayS(t).reduce((s,x)=>s+x.tot,0))} ج</div>
${s0.map(x=>`<div class="row" onclick="vInv(${x.id})"><div class="m"><b>فاتورة #${x.no} · ${escQ(x.cn)}</b><small class="h">${x.items.length} صنف · ${x.pay} · ${x.dt==t?tm(x.tm):x.dt}</small></div><b>${f2(x.tot)}</b></div>`).join('')||'<div class="card st n">مفيش فواتير لسه - دوس + لفتح فاتورة</div>'}`};

let pq='',pc='';
V.p=function(){const q=pq.toLowerCase(),L=S.prods.filter(p=>(!pc||p.cat==pc)&&(!q||p.n.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
return`<div style="margin:12px 16px 0"><input id="pq" placeholder="🔍 دوّر بالاسم أو الكود" value="${escQ(pq)}" oninput="pq=this.value;R();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>
<div class="chps"><button class="chp ${!pc?'on':''}" onclick="pc='';R()">الكل</button>${S.cats.map(c=>`<button class="chp ${pc==c?'on':''}" onclick="pc='${c}';R()">${c}</button>`).join('')}</div>
${L.map(p=>`<div class="row" onclick="eP(${p.id})"><div class="m"><b>${escQ(p.n)}</b><small class="h">${p.sku} · ${p.cat}</small></div><div style="text-align:center"><b>${f2(p.price)}</b><small class="h" style="${p.stock<=3?'color:var(--rd);font-weight:700':''}">المخزون: ${p.stock}</small></div></div>`).join('')||'<div class="card st n">مفيش أصناف مطابقة</div>'}`};

V.b=function(){const L=S.purs.slice().sort((a,b)=>b.no-a.no);
return`<div class="bdg">أوامر شراء: ${L.length} · إجمالي: ${f2(L.reduce((s,x)=>s+x.tot,0))} ج</div>
${L.map(x=>`<div class="row w"><div class="m"><b>أمر شراء #${x.no} · ${escQ(x.sn)}</b><small class="h">${x.items.length} صنف · ${x.pay} · ${x.dt}</small></div><b>${f2(x.tot)}</b></div>`).join('')||'<div class="card st n">مفيش مشتريات لسه - دوس + لأمر شراء</div>'}`};

V.m=function(){const ow=sess.u.role=='owner';
return`${[['👥','العملاء والموردين','أرصدة الآجل والكشوفات','pgC()'],['🔧','الصيانة','تيكيتات الإصلاح وقطع الغيار','pgM()'],['🧮','الحسابات','ملخص مالي كامل','pgA()'],...(ow?[['👤','المستخدمين','الصلاحيات والحسابات','pgU()']]:[]),['⚙️','الإعدادات','هوية المحل والفرع','pgSet()']].map(([i,t,s2,f])=>`<div class="row" onclick="${f}"><span style="font-size:26px">${i}</span><div class="m"><b>${t}</b><small class="h">${s2}</small></div><span style="color:var(--t2)">‹</span></div>`).join('')}
<div class="card"><button class="pri dng" style="margin:0" onclick="logout()">تسجيل خروج</button></div>`};

/* ---------- sales invoice ---------- */
function nS(){window._d={items:[],pay:'كاش'};
sh('فاتورة بيع جديدة',`<label>العميل</label><select id="isc"><option value="0">عميل نقدي</option>${S.custs.map(c=>`<option value="${c.id}">${escQ(c.n)}</option>`).join('')}</select>
<label>الصنف</label><select id="isp">${S.prods.map(p=>`<option value="${p.id}">${escQ(p.n)} · متاح ${p.stock}</option>`).join('')}</select>
<div class="c2"><div><label>الكمية</label><input id="isq" type="number" value="1" inputmode="numeric"></div><div><label>سعر البيع</label><input id="iss" type="number" inputmode="decimal" placeholder="0.00"></div></div>
<button onclick="aI()">＋ إضافة الصنف</button><div id="itm"></div>
<label>الدفع</label><div class="seg"><button class="on" onclick="pT('كاش',this)">كاش</button><button onclick="pT('آجل',this)">آجل (على العميل)</button></div>
<div class="bdg" id="itot">الإجمالي: 0.00 ج</div>
<div class="er" id="ise"></div>
<button class="pri" onclick="svS()">حفظ الفاتورة</button>`);
$('#isp').onchange=()=>{const p=S.prods.find(x=>x.id==$('#isp').value);if(p)$('#iss').value=p.price}}
function pT(v,b){window._d.pay=v;[...b.parentElement.children].forEach(x=>x.classList.toggle('on',x==b))}
function aI(){const p=S.prods.find(x=>x.id==$('#isp').value),q=+$('#isq').value,pr=+($('#iss').value||p.price);
if(!(q>0))return;if(q>p.stock)return toast('المخزون مش كفاية - متاح '+p.stock);
window._d.items.push({pid:p.id,n:p.n,q,p:pr,c:p.cost});rI()}
function rI(){const d=window._d;$('#itm').innerHTML=d.items.map((i,x)=>`<div class="itl"><div class="m"><b>${escQ(i.n)}</b> <small class="h">× ${i.q} · ${f2(i.p)}</small></div><b>${f2(i.q*i.p)}</b><button onclick="window._d.items.splice(${x},1);rI()">✕</button></div>`).join('');
$('#itot').textContent='الإجمالي: '+f2(d.items.reduce((s,i)=>s+i.q*i.p,0))+' ج'}
function svS(){const d=window._d;if(!d.items.length)return $('#ise').textContent='ضيف صنف واحد على الأقل';
const cid=+$('#isc').value,cn=cid?S.custs.find(x=>x.id==cid).n:'عميل نقدي';
if(d.pay=='آجل'&&!cid)return $('#ise').textContent='فاتورة آجلة لازم تختار عميل مسجل';
const tot=d.items.reduce((s,i)=>s+i.q*i.p,0);
d.items.forEach(i=>{const p=S.prods.find(x=>x.id==i.pid);if(p)p.stock-=i.q});
S.sales.push({id:Date.now(),no:S.seq.s++,dt:td(),tm:Date.now(),cust:cid,cn,items:d.items,tot,pay:d.pay,us:sess.u.n});
if(d.pay=='آجل')S.custs.find(x=>x.id==cid).bal+=tot;
save();ovx();toast('اتحفظت الفاتورة #'+ (S.seq.s-1) +' ✅');R()}

function vInv(id){const v=S.sales.find(x=>x.id==id);if(!v)return;
pg('فاتورة #'+v.no,`<div class="card" style="text-align:center"><div class="br" style="font-size:30px">${brH()}</div><small class="h">${escQ(S.branch)} · ${escQ(BR().tg)}</small></div>
<div class="card"><div class="c2"><div><small class="h">رقم الفاتورة</small><b>#${v.no}</b></div><div><small class="h">التاريخ</small><b>${v.dt} ${tm(v.tm)}</b></div></div>
<small class="h" style="margin-top:8px">العميل</small><b>${escQ(v.cn)}</b><small class="h"> · ${v.pay} · بواسطة ${escQ(v.us)}</small></div>
<div class="tw"><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>
${v.items.map(i=>`<tr><td>${escQ(i.n)}</td><td>${i.q}</td><td>${f2(i.p)}</td><td>${f2(i.q*i.p)}</td></tr>`).join('')}
<tr><td colspan="3"><b>الإجمالي</b></td><td><b>${f2(v.tot)} ج</b></td></tr></table></div>
<div class="card"><button class="pri" style="margin:0" onclick="window.print()">🖨️ طباعة / حفظ PDF</button></div>
<div class="card"><button class="pri dng" style="margin:0" onclick="ovx();voidInv(${v.id})">إلغاء الفاتورة</button></div>`)}
function voidInv(id){const v=S.sales.find(x=>x.id==id);if(!v)return;
ask(`إلغاء الفاتورة #${v.no}؟`,'الأصناف هترجع للمخزون والمبلغ هيتشال من حساب العميل لو آجل','إلغاء الفاتورة',()=>{
v.items.forEach(i=>{const p=S.prods.find(x=>x.id==i.pid);if(p)p.stock+=i.q});
if(v.pay=='آجل'&&v.cust){const c=S.custs.find(x=>x.id==v.cust);if(c)c.bal-=v.tot}
S.sales=S.sales.filter(x=>x.id!=id);save();document.querySelectorAll('.pg').forEach(x=>x.remove());toast('اتلغت الفاتورة');R()})}

/* ---------- products ---------- */
function nP(){sh('صنف جديد',`<label>اسم الصنف</label><input id="pn">
<label>الفئة</label><select id="pc2">${S.cats.map(c=>`<option>${c}</option>`).join('')}</select>
<label>الكود (SKU)</label><input id="ps" placeholder="مثال: CH-003">
<div class="c2"><div><label>سعر التكلفة</label><input id="pco" type="number" inputmode="decimal"></div><div><label>سعر البيع</label><input id="ppr" type="number" inputmode="decimal"></div></div>
<label>الرصيد الافتتاحي</label><input id="pst" type="number" inputmode="numeric" value="0">
<div class="er" id="pe"></div>
<button class="pri" onclick="svP()">حفظ الصنف</button>`)}
function svP(){const n=$('#pn').value.trim();if(n.length<2)return $('#pe').textContent='اكتب اسم الصنف';
const sku=$('#ps').value.trim()||'P-'+String(S.seq.pr).padStart(3,'0');
if(S.prods.some(p=>p.sku==sku))return $('#pe').textContent='الكود ده مستخدم قبل كده';
S.prods.push({id:S.seq.pr,sku,n,cat:$('#pc2').value,cost:+$('#pco').value||0,price:+$('#ppr').value||0,stock:+$('#pst').value||0});S.seq.pr++;
save();ovx();toast('اتحفظ الصنف ✅');R()}
function eP(id){const p=S.prods.find(x=>x.id==id);if(!p)return;
sh('تعديل صنف',`<label>اسم الصنف</label><input id="pn" value="${escQ(p.n)}">
<label>الفئة</label><select id="pc2">${S.cats.map(c=>`<option ${c==p.cat?'selected':''}>${c}</option>`).join('')}</select>
<small class="h">الكود: ${p.sku}</small>
<div class="c2"><div><label>سعر التكلفة</label><input id="pco" type="number" inputmode="decimal" value="${p.cost}"></div><div><label>سعر البيع</label><input id="ppr" type="number" inputmode="decimal" value="${p.price}"></div></div>
<label>المخزون الحالي</label><input id="pst" type="number" inputmode="numeric" value="${p.stock}">
<button class="pri" onclick="upP(${id})">حفظ التعديلات</button>
<button class="pri dng" style="margin-top:8px" onclick="ovx();delP(${id})">حذف الصنف</button>`)}
function upP(id){const p=S.prods.find(x=>x.id==id);if(!p)return;
p.n=$('#pn').value.trim()||p.n;p.cat=$('#pc2').value;p.cost=+$('#pco').value||0;p.price=+$('#ppr').value||0;p.stock=+$('#pst').value||0;
save();ovx();toast('اتحفظ ✅');R()}
function delP(id){const p=S.prods.find(x=>x.id==id);if(!p)return;
ask(`حذف "${p.n}"؟`,'هيتشال من قائمة الأصناف نهائياً','حذف الصنف',()=>{S.prods=S.prods.filter(x=>x.id!=id);save();toast('اتحذف');R()})}

sh('أمر شراء جديد',`<label>المورد</label><select id="bsc">${S.sups.map(c=>`<option value="${c.id}">${escQ(c.n)}</option>`).join('')}</select>
<label>الصنف</label><select id="bsp">${S.prods.map(p=>`<option value="${p.id}">${escQ(p.n)} · مخزون ${p.stock}</option>`).join('')}</select>

<button onclick="aB()">＋ إضافة الصنف</button><div id="itm"></div>
<label>الدفع</label><div class="seg"><button class="on" onclick="pT('كاش',this)">كاش</button><button onclick="pT('آجل',this)">آجل (على المورد)</button></div>

<div class="er" id="bse"></div>

$('#bsp').onchange=()=>{const p=S.prods.find(x=>x.id==$('#bsp').value);if(p)$('#bss').value=p.cost}}
function aB(){const p=S.prods.find(x=>x.id==$('#bsp').value),q=+$('#bsq').value,c=+($('#bss').value||p.cost);
if(!(q>0)||!(c>0))return toast('اكتب كمية وسعر صح');
window._d.items.push({pid:p.id,n:p.n,q,c});rI()}
function svB(){const d=window._d;if(!d.items.length)return $('#bse').textContent='ضيف صنف واحد على الأقل';
const sid=+$('#bsc').value,sn=S.sups.find(x=>x.id==sid).n,tot=d.items.reduce((s,i)=>s+i.q*i.c,0);

if(d.pay=='آجل')S.sups.find(x=>x.id==sid).bal+=tot;

function pgC(){const L=csT=='c'?S.custs:S.sups,t=csT=='c'?'عميل':'مورد';
pg('العملاء والموردين',`<div style="margin:12px 16px 0"><div class="seg"><button class="${csT=='c'?'on':''}" onclick="csT='c';document.querySelectorAll('.pg').forEach(x=>x.remove());pgC()">العملاء</button><button class="${csT=='s'?'on':''}" onclick="csT='s';document.querySelectorAll('.pg').forEach(x=>x.remove());pgC()">الموردين</button></div></div>

save();document.querySelectorAll('.pg').forEach(x=>x.remove());pgC();toast('اتحفظ ✅')}

/* ---------- maintenance ---------- */
function pgM(){pg('الصيانة',`<div class="bdg">تيكيتات جارية: ${S.maint.filter(x=>x.st=='جاري').length}</div>
${S.maint.slice().sort((a,b)=>b.no-a.no).map(m=>{const pt=m.pid?pName(m.pid):'بدون قطعة';return`<div class="row"><div class="m"><b>${escQ(m.dev)} · ${escQ(m.cust)}</b><small class="h">${m.prob} · ${pt} · أجرة ${f2(m.fee)}</small></div><div style="text-align:center"><span class="stt ${m.st=='جاري'?'y':'g'}">${m.st}</span>${m.st!='مستلم'?`<br><button style="margin-top:6px;min-height:36px;padding:4px 14px;font-size:15px" onclick="adM(${m.id})">${m.st=='جاري'?'تم الإصلاح':'تسليم'}</button>`:''}</div></div>`}).join('')}
<div class="card"><h3>تيكيت جديد</h3><label>اسم العميل</label><input id="mc"><label>الجهاز</label><input id="md" placeholder="مثال: iPhone 12"><label>العطل</label><input id="mp2">
<label>قطعة الغيار (بتتخصم من المخزون)</label><select id="mpt"><option value="0">بدون قطعة</option>${S.prods.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${escQ(p.n)} · متاح ${p.stock}</option>`).join('')}</select>
<label>أجرة الإصلاح</label><input id="mf" type="number" inputmode="decimal" value="0">
<div class="er" id="me2"></div><button class="pri" onclick="svM()">حفظ التيكيت</button></div>`)}
function svM(){const c=$('#mc').value.trim(),dv=$('#md').value.trim();if(c.length<2||dv.length<2)return $('#me2').textContent='اكتب اسم العميل والجهاز';
const pid=+$('#mpt').value||null;if(pid){const p=S.prods.find(x=>x.id==pid);if(p.stock<1)return $('#me2').textContent='القطعة مش متاحة في المخزون';p.stock--}
S.maint.push({id:Date.now(),no:S.seq.m++,dt:td(),cust:c,dev:dv,prob:$('#mp2').value.trim(),pid,fee:+$('#mf').value||0,st:'جاري'});
save();document.querySelectorAll('.pg').forEach(x=>x.remove());pgM();toast('اتحفظ التيكيت ✅')}
function adM(id){const m=S.maint.find(x=>x.id==id);if(!m)return;m.st=m.st=='جاري'?'تم':'مستلم';save();document.querySelectorAll('.pg').forEach(x=>x.remove());pgM()}

/* ---------- accounts ---------- */
function pgA(){const st=S.sales.reduce((s,x)=>s+x.tot,0),sc=S.sales.reduce((s,x)=>s+costOf(x),0),pt=S.purs.reduce((s,x)=>s+x.tot,0),mf=S.maint.filter(m=>m.st!='ملغي').reduce((s,m)=>s+m.fee,0);
pg('الحسابات',`<div class="g2">
<div class="card k"><small>🧾 إجمالي المبيعات</small><b>${f2(st)}</b></div>
<div class="card k"><small>💵 أجور صيانة</small><b>${f2(mf)}</b></div>
<div class="card k"><small>📉 تكلفة البضاعة المباعة</small><b>${f2(sc)}</b></div>
<div class="card k"><small>⭐ مجمل الربح</small><b>${f2(st-sc+mf)}</b></div>
<div class="card k"><small>🛒 إجمالي المشتريات</small><b>${f2(pt)}</b></div>
<div class="card k"><small>📦 قيمة المخزون</small><b>${f2(stockVal())}</b></div>
<div class="card k"><small>📒 مستحق على العملاء</small><b>${f2(sumBal(S.custs))}</b></div>
<div class="card k"><small>🏭 مستحق للموردين</small><b>${f2(sumBal(S.sups))}</b></div>
</div>
<small class="h" style="margin:0 16px;display:block;text-align:center">من غير ضرايب (VAT) دلوقتي — حسب إعدادات المرحلة الأولى</small>`)}

/* ---------- users ---------- */
function pgU(){if(sess.u.role!='owner')return;
pg('المستخدمين',`${S.users.map((x,i)=>`<div class="row"><div class="m"><b>${escQ(x.n)}</b><small class="h">${x.u} · ${x.role=='owner'?'مالك':'كاشير'}${x.off?' · موقوف':''}</small></div>${i?`<button onclick="tgU2(${i})">${x.off?'تفعيل':'إيقاف'}</button>`:''}</div>`).join('')}
<div class="card"><h3>مستخدم جديد</h3><label>الاسم</label><input id="un"><label>اسم المستخدم (للدخول)</label><input id="uu" style="direction:ltr"><label>كلمة السر</label><input id="up" type="password" inputmode="numeric">
<label>الصلاحية</label><div class="seg" id="ur"><button class="on" data-r="cashier">كاشير</button><button data-r="owner">مالك</button></div>
<div class="er" id="ue"></div><button class="pri" onclick="svU()">إضافة المستخدم</button></div>`);
$('#ur').onclick=e=>{if(e.target.dataset.r)[...$('#ur').children].forEach(b=>b.classList.toggle('on',b==e.target))}}
async function svU(){const n=$('#un').value.trim(),u=$('#uu').value.trim().toLowerCase(),p=$('#up').value;
if(n.length<2||u.length<2||p.length<4)return $('#ue').textContent='اكتب الاسم واسم المستخدم وكلمة سر 4 خانات على الأقل';
if(S.users.some(x=>x.u==u))return $('#ue').textContent='اسم المستخدم ده موجود';
const role=[...$('#ur').children].find(b=>b.classList.contains('on')).dataset.r;
S.users.push({u,n,h:await H(p),role});save();document.querySelectorAll('.pg').forEach(x=>x.remove());pgU();toast('اتحفظ ✅')}
function tgU2(i){S.users[i].off=!S.users[i].off;save();document.querySelectorAll('.pg').forEach(x=>x.remove());pgU()}

/* ---------- settings ---------- */
function pgSet(){const b=BR();
pg('الإعدادات',`<div class="card"><h3>🏪 الفرع</h3><label>اسم الفرع</label><input id="brn2" value="${escQ(S.branch)}"><small class="h">النظام متصمم يدعم فروع متعددة لاحقاً</small></div>
<div class="card"><h3>🎨 هوية التطبيق</h3><label>اسم المحل</label><input id="brn" value="${escQ(b.n)}"><label>الأيقونة</label><input id="bric" value="${escQ(b.ic)}" maxlength="4"><label>الوصف</label><input id="brtg" value="${escQ(b.tg)}"><label>اللون</label><input id="brcl" type="color" value="${b.cl}" style="height:56px;padding:4px"><button class="pri" onclick="brSave()">حفظ الهوية</button></div>
<div class="card"><h3>🧪 بيانات تجريبية</h3><small class="h">النسخة دي للتصميم والتجربة بس — البيانات على الجهاز ده ومش متزامنة</small><button class="pri dng" onclick="ask('مسح البيانات التجريبية؟','هترجع البيانات الافتراضية من الأول','مسح وإعادة',async()=>{localStorage.removeItem(K);S=await defS();save();R();toast('اتعملت إعادة الضبط')})">إعادة ضبط البيانات</button></div>`)}
function brSave(){S.branch=$('#brn2').value.trim()||'الفرع الرئيسي';S.brand={n:$('#brn').value.trim()||'M STORE',ic:$('#bric').value.trim()||'💵',tg:$('#brtg').value.trim(),cl:$('#brcl').value||'#0A57D6'};save();document.querySelectorAll('.pg').forEach(x=>x.remove());R();toast('اتحفظت الهوية ✅')}

/* ---------- boot ---------- */
async function init(){
const raw=localStorage.getItem('merp1');S=raw?JSON.parse(raw):await defS();if(!raw)save();
applyBrand();
const sv0=localStorage.getItem('merp-sess');if(sv0){try{const q=JSON.parse(sv0),us=S.users.find(x=>x.u==q.u);if(us&&!us.off&&us.h==q.h)sess={u:us};else localStorage.removeItem('merp-sess')}catch(e){localStorage.removeItem('merp-sess')}}
setTimeout(R,900)}
init();
</script></body></html>
